<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="480" height="600" role="img" aria-label="Agente IA, un collega in più nel team Soraia">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="62%">
      <stop offset="0" stop-color="#5A2B7A"/>
      <stop offset="0.55" stop-color="#2B0F44"/>
      <stop offset="1" stop-color="#120621"/>
    </radialGradient>
    <radialGradient id="head" cx="42%" cy="38%" r="70%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#E9D5F5"/>
      <stop offset="0.8" stop-color="#B07CC9"/>
      <stop offset="1" stop-color="#892D9C"/>
    </radialGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1C1F"/>
      <stop offset="1" stop-color="#0B0B0D"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="480" height="600" fill="url(#bg)"/>

  <!-- alone dietro la testa -->
  <circle cx="240" cy="290" r="130" fill="#A855C8" opacity="0.45" filter="url(#glow)"/>

  <!-- maglietta nera, come nelle foto del team -->
  <path d="M78 600 C 84 486, 150 436, 240 436 C 330 436, 396 486, 402 600 Z" fill="url(#shirt)"/>
  <path d="M196 436 C 210 452, 270 452, 284 436" fill="none" stroke="#2A2A2E" stroke-width="6" stroke-linecap="round"/>
  <!-- piccolo marchio sul petto -->
  <path d="M300 520 l6 -14 l6 14 l14 6 l-14 6 l-6 14 l-6 -14 l-14 -6 z" fill="#D8B4E8" opacity="0.9"/>

  <!-- collo luminoso -->
  <rect x="222" y="372" width="36" height="70" rx="18" fill="#B07CC9" opacity="0.9"/>

  <!-- testa: sfera luminosa -->
  <circle cx="240" cy="290" r="98" fill="url(#head)"/>
  <circle cx="240" cy="290" r="98" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>
  <!-- riflesso -->
  <ellipse cx="205" cy="240" rx="28" ry="16" fill="#FFFFFF" opacity="0.55" filter="url(#soft)"/>

  <!-- volto -->
  <ellipse cx="212" cy="286" rx="9" ry="14" fill="#2A0E36"/>
  <ellipse cx="268" cy="286" rx="9" ry="14" fill="#2A0E36"/>
  <circle cx="215" cy="281" r="3" fill="#FFFFFF"/>
  <circle cx="271" cy="281" r="3" fill="#FFFFFF"/>
  <path d="M208 326 Q240 356 272 326" fill="none" stroke="#2A0E36" stroke-width="7" stroke-linecap="round"/>

  <!-- scintille -->
  <path d="M118 150 l8 -22 l8 22 l22 8 l-22 8 l-8 22 l-8 -22 l-22 -8 z" fill="#F4B842"/>
  <path d="M372 112 l5 -14 l5 14 l14 5 l-14 5 l-5 14 l-5 -14 l-14 -5 z" fill="#F4B842" opacity="0.9"/>
  <path d="M392 236 l4 -11 l4 11 l11 4 l-11 4 l-4 11 l-4 -11 l-11 -4 z" fill="#D8B4E8" opacity="0.9"/>
  <circle cx="96" cy="262" r="4" fill="#D8B4E8" opacity="0.8"/>
</svg>

name: AI visibility (monthly)

# Once a month, ask a fixed panel of buyer questions (automation/ai-visibility-questions.json) to
# the AI engines we have keys for, and record whether Soraia is named or cited and which sites are
# cited instead. Results land in automation/ai-visibility/YYYY-MM.json and in the run summary.
#
# Secrets: ANTHROPIC_API_KEY (already used by monthly-content.yml). Optional, one engine each:
#   OPENAI_API_KEY (ChatGPT search), PERPLEXITY_API_KEY, GEMINI_API_KEY.

on:
  schedule:
    - cron: "0 7 2 * *" # 2nd of each month, 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-visibility
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # Same scoped PAT as monthly-content.yml: the org disables write for the default token.
          token: ${{ secrets.BLOG_BOT_TOKEN || github.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Ask the panel
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node automation/ai-visibility.mjs

      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add automation/ai-visibility/
          if git diff --cached --quiet; then
            echo "No report to commit."
          else
            git commit -m "ai-visibility: monthly report [skip ci]"
            git push origin HEAD:main
          fi

name: Confronto draft (AI author)

# Weekly (Friday, a different day than blog Mon/Thu and guide Wed) -> 1 comparison/week:
# pick the first `todo` topic from automation/confronto-topics.json, generate a bilingual
# A-vs-B comparison (draft:true) with Claude, and open a "Draft confronto: ..." PR on a
# confronto/ branch. Never publishes directly; confronto-quality-gates.yml gates it and
# (with AUTOPUBLISH on) flips draft:false and merges. Requires ANTHROPIC_API_KEY.

on:
  schedule:
    - cron: "0 4 * * 5" # Fridays 06:00 Europe/Rome (04:00 UTC) -> 1 comparison/week
  workflow_dispatch:
    inputs:
      skip_slug:
        description: "Topic slug to reject + skip (set by auto-rotation when a draft can't pass)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: confronto-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Generate confronto draft
        id: author
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTHOR_MODEL: ${{ vars.AUTHOR_MODEL }}
          AUTOPUBLISH: ${{ vars.AUTOPUBLISH }}
          SKIP_SLUG: ${{ github.event.inputs.skip_slug }}
        run: node automation/confronto-author.mjs

      - name: Open draft PR
        if: steps.author.outputs.drafted == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          # The confronto/ branch prefix is load-bearing: confronto-quality-gates.yml only
          # auto-publishes/auto-fixes on it.
          token: ${{ secrets.BLOG_BOT_TOKEN || github.token }}
          branch: confronto/${{ steps.author.outputs.slug }}
          base: main
          title: "Draft confronto: ${{ steps.author.outputs.title }}"
          body: ${{ steps.author.outputs.prbody }}
          commit-message: "Confronto draft: ${{ steps.author.outputs.slug }} (draft:true)"
          delete-branch: true
